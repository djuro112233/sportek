name: vrmac-lh-ci

on:
  push:
    paths: ["vrmac-lh/**", ".github/workflows/vrmac-lh-ci.yml"]
  pull_request:
    paths: ["vrmac-lh/**", ".github/workflows/vrmac-lh-ci.yml"]

jobs:
  backend:
    name: Backend tests (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vrmac-lh/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vrmac
          POSTGRES_PASSWORD: vrmac
          POSTGRES_DB: vrmac_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrmac -d vrmac_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vrmac:vrmac@127.0.0.1:5432/vrmac_test
      SECRET_KEY: ci-only-secret-key-0123456789
      EVENT_PSEUDONYM_KEY: ci-only-pseudonym-key-0123456789
      # Offline providers: no model download in CI, deterministic results.
      TEST_EMBEDDINGS_PROVIDER: hash
      TEST_LLM_PROVIDER: none
      TEST_SUPPORT_CHECK_PROVIDER: lexical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vrmac-lh/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (validation gate, grounding per language, onboarding timing, KPIs, NGSI-LD export)
        run: pytest -q --junitxml=../docs/test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrmac-lh-test-results
          path: vrmac-lh/docs/test-results/

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vrmac-lh/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vrmac-lh/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (backend)
        run: pip-audit -r vrmac-lh/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (frontend)
        working-directory: vrmac-lh/frontend
        run: npm audit --audit-level=high

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
        working-directory: vrmac-lh
