[project]
name = "mila"
version = "0.1.0"
description = "MILA - open-source, voice-first information and referral assistant for reproductive and maternal health (information + referral, never diagnosis)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<2.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "piper-tts>=1.2"]
embed = ["sentence-transformers>=3.0"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
redis = ["redis>=5"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "fpdf2>=2.7",
  "jiwer>=3.0",
  "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend", "scripts"]
exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
