# MILA knowledge-base manifest (schema version 1).
#
# Every answer MILA gives is tied to a chunk of one of these documents. Fields:
#   id             stable identifier (lowercase, [a-z0-9._-]); becomes Source.id and the chunk-id prefix
#   file           path relative to kb/; WHO files live under downloads/ (git-ignored) and are fetched
#                  with `scripts/ingest_kb.py --download`
#   sha256         optional; when set, the file (or download) must match or ingestion fails
#   reviewed_by    non-empty => review_status "reviewed"; empty => "public_unreviewed" (demo mode only)
#   status         optional; "blocked" keeps the source out of every answer
#   allowed_topics subset of app.core.types.TOPIC_CLASSES
#   download       true => scripts/ingest_kb.py --download may fetch `url` when the file is missing
version: 1
documents:
  # --- WHO primary sources (not in the repo; verify licence + sha256 on first download) -------------
