name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  MILA_APP_ENV: test

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check backend scripts
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Test
        run: python -m pytest backend/tests -q --junitxml=reports/junit-${{ matrix.python }}.xml
      - name: Test count
        if: always()
        run: |
          python - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in glob.glob("reports/junit-*.xml"):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else root.iter("testsuite")
              for s in suites:
                  total += int(s.get("tests", 0))
                  failures += int(s.get("failures", 0))
                  errors += int(s.get("errors", 0))
                  skipped += int(s.get("skipped", 0))
          print(f"tests run: {total}, failures: {failures}, errors: {errors}, skipped: {skipped}")
          EOF
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-${{ matrix.python }}
          path: reports/junit-*.xml
          retention-days: 14

  adversarial-count:
    name: adversarial and total test counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Count collected tests
        run: |
          set -euo pipefail
          count() {
            # pytest prints "<N> tests collected" (or "no tests collected") as the last summary line.
            # addopts is cleared because pyproject already passes -q, and "-qq" drops that line.
            python -m pytest "$1" --collect-only -q -o addopts="" 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' || echo 0
          }
          adversarial=$(count backend/tests/adversarial)
          total=$(count backend/tests)
          echo "adversarial tests collected: ${adversarial} (minimum 40)"
          echo "total tests collected: ${total} (minimum 150)"
          status=0
          if [ "${adversarial}" -lt 40 ]; then echo "::error::fewer than 40 adversarial tests"; status=1; fi
          if [ "${total}" -lt 150 ]; then echo "::error::fewer than 150 tests in the suite"; status=1; fi
          exit "${status}"

  web:
    # Node 22: `npm test` runs the .ts suites with node:test's built-in type stripping (22.18+).
    # The app itself still runs on Node 20 (see web/Dockerfile).
    name: web (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: docker build (api, web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: false
          tags: mila-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: false
          load: false
          tags: mila-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
