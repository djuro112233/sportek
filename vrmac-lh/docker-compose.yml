# VRMAC-LH prototype.
#
# Memory: db 512M + redis 64M + api 900M + worker 640M + scheduler 128M + web 320M is about
# 2.6 GB and fits a 2 vCPU / 4 GB VPS when the models come from the EU inference provider
# (LLM_PROVIDER=eu_api with COMPOSE_PROFILES empty). The shipped default also starts Ollama
# (profile "local-llm", 2.2 GB) so the demo needs no API key; that configuration wants about
# 6 GB, a laptop rather than the small VPS. See README, "Deploy on a small EU VPS".
# Prototype built for the SMART ERA application, September–October 2026. Sample data.
name: vrmac-lh

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vrmac}:${POSTGRES_PASSWORD:-vrmac}@db:5432/${POSTGRES_DB:-vrmac}
    REDIS_URL: redis://redis:6379/0
    OLLAMA_URL: http://ollama:11434
    UPLOAD_DIR: /data/uploads
    EXPORT_DIR: /data/exports
    HF_HOME: /models

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vrmac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vrmac}
      POSTGRES_DB: ${POSTGRES_DB:-vrmac}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vrmac} -d ${POSTGRES_DB:-vrmac}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2200M

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "${LLM_MODEL:-qwen2.5:1.5b}" && ollama pull "${EMBEDDINGS_MODEL:-paraphrase-multilingual}"
    restart: "no"

  api:
    build: ./backend
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
      - models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 900M

  worker:
    build: ./backend
    <<: *backend-env
    command: ["python", "-m", "app.cli", "worker"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - appdata:/data
      - models:/models
    deploy:
      resources:
        limits:
          memory: 640M

  scheduler:
    build: ./backend
    <<: *backend-env
    # nightly: KPI computation (02:00 UTC) and expiry of stale visitor requests
    command: ["python", "-m", "app.cli", "kpi-schedule", "--hour", "2"]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 320M

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  ollama:
  appdata:
  models:
  caddy_data:
  caddy_config:
