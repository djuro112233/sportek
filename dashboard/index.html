            maxHeight: 350, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 16,
          }}>
            {CHAT_QA.map((item, i) => (
              <React.Fragment key={i}>
                {/* User bubble — right */}
                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <div style={{
                    background: C.teal, borderRadius: 12, padding: '8px 16px',
                    maxWidth: '70%', fontSize: 13, color: C.white,
                  }}>{item.q}</div>

                {/* AI bubble — left */}
                <div style={{ display: 'flex', justifyContent: 'flex-start' }}>

                    background: C.border, borderRadius: 12, padding: '8px 16px',
                    maxWidth: '70%', fontSize: 13, color: C.white,

                    <div>{item.a}</div>
                    <div style={{ color: C.grey, fontSize: 11, fontStyle: 'italic', marginTop: 6 }}>Izvor: {item.src}</div>

          {/* Doc Usage Chart */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', marginBottom: 16 }}>Document Usage — Top queries</div>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={DOC_USAGE} layout="vertical" margin={{ top: 5, right: 30, left: 120, bottom: 5 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} horizontal={false} />
                <XAxis type="number" tick={{ fill: C.grey, fontSize: 11 }} />
                <YAxis type="category" dataKey="doc" tick={{ fill: C.grey, fontSize: 11 }} width={110} />
                <Tooltip {...darkTooltip} />
                <Bar dataKey="queries" fill={C.teal} radius={[0,4,4,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>

          {/* ROI Box */}
          <div style={{
            background: '#0F2A1F', border: `1px solid ${C.green}`, borderRadius: 8, padding: 16,
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 24, fontSize: 14, fontWeight: 600,
          }}>
            <span style={{ color: C.green }}>{'\u20AC'}20,431/god</span>
            <span style={{ color: C.border }}>|</span>
            <span style={{ color: C.white }}>Payback: 4.4 mj</span>
            <span style={{ color: C.border }}>|</span>
            <span style={{ color: C.teal }}>ROI: 170%</span>
          </div>
        </div>
      );
    }

    // ── FORECAST TAB ─────────────────────────────────────────
    const forecastData = Array.from({length:44}, (_, i) => {
      const base = 2500 + Math.sin(i/6)*400 + (i<20?0:i*5);
      const actual = i<40 ? Math.round(base + (Math.random()-0.5)*300) : null;
      const forecast = i>=38 ? Math.round(base + (Math.random()-0.5)*100) : null;
      const upper = forecast ? forecast + 250 : null;
      const lower = forecast ? forecast - 250 : null;
      return {week:'W'+(i+1), actual, forecast, upper, lower};
    });

    const MODEL_COMPARISON = [
      { model: 'Holt-Winters', mae: 245, rmse: 312, mape: '5.8%', best: false },
      { model: 'Random Forest', mae: 98, rmse: 142, mape: '3.03%', best: true },
      { model: 'Gradient Boosting', mae: 156, rmse: 198, mape: '4.2%', best: false },
    ];

    const STOCKOUT_RISKS = [
      { material: 'Flyknit Yarn Black', days: 5, risk: 'HIGH', action: 'Order now' },
      { material: 'Carbon Fiber Plate', days: 3, risk: 'HIGH', action: 'Urgent order' },
      { material: 'EVA Foam 8mm', days: 12, risk: 'MEDIUM', action: 'Plan order' },
      { material: 'TPU Film Clear', days: 18, risk: 'LOW', action: 'Monitor' },
      { material: 'Nylon Ripstop', days: 8, risk: 'MEDIUM', action: 'Plan order' },
      { material: 'PU Adhesive', days: 22, risk: 'LOW', action: 'OK' },
    ];

    const RISK_COLORS = { HIGH: C.red, MEDIUM: C.yellow, LOW: C.green };
    const RISK_EMOJI = { HIGH: '\uD83D\uDD34', MEDIUM: '\uD83D\uDFE1', LOW: '\uD83D\uDFE2' };

    function ForecastTab() {
      const darkTooltip = { contentStyle: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 12 }, itemStyle: { color: C.white }, labelStyle: { color: C.grey } };
      const thStyle = { padding: '10px 14px', textAlign: 'left', fontSize: 12, fontWeight: 600, color: C.grey, textTransform: 'uppercase', borderBottom: `1px solid ${C.border}` };
      const tdStyle = { padding: '10px 14px', fontSize: 13, color: C.white, borderBottom: `1px solid ${C.border}` };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          {/* Top row — 3 metric cards */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }}>
            <div className="card" style={{ textAlign: 'center' }}>
              <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Best Model</div>
              <div style={{ fontSize: 28, fontWeight: 700, color: C.teal }}>Random Forest</div>
            </div>
            <div className="card" style={{ textAlign: 'center' }}>
              <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>MAPE</div>
              <div style={{ fontSize: 36, fontWeight: 700, color: C.green }}>3.03%</div>
            </div>
            <div className="card" style={{ textAlign: 'center' }}>
              <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Stockout Risks</div>
              <div style={{ fontSize: 36, fontWeight: 700, color: C.red }}>12</div>
            </div>
          </div>

          {/* Forecast Chart */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', marginBottom: 16 }}>Demand Forecast — 44 sedmica</div>
            <ResponsiveContainer width="100%" height={300}>
              <ComposedChart data={forecastData} margin={{ top: 5, right: 30, left: 0, bottom: 5 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
                <XAxis dataKey="week" tick={{ fill: C.grey, fontSize: 10 }} interval={4} />
                <YAxis tick={{ fill: C.grey, fontSize: 11 }} />
                <Tooltip {...darkTooltip} />
                <Legend iconType="circle" wrapperStyle={{ fontSize: 12 }} />
                <Area type="monotone" dataKey="upper" stroke="none" fill={C.teal} fillOpacity={0.15} name="Upper bound" />
                <Area type="monotone" dataKey="lower" stroke="none" fill={C.bg} fillOpacity={1} name="Lower bound" />
                <Line type="monotone" dataKey="actual" stroke={C.white} strokeWidth={2} dot={false} name="Actual" />
                <Line type="monotone" dataKey="forecast" stroke={C.teal} strokeWidth={2} strokeDasharray="5 5" dot={false} name="Forecast" />
                <ReferenceLine x="W38" stroke={C.yellow} strokeDasharray="3 3" label={{ value: 'Forecast start', fill: C.yellow, fontSize: 11 }} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          {/* Model Comparison Table */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', marginBottom: 16 }}>Model Comparison</div>
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr>
                  <th style={thStyle}>Model</th>
                  <th style={thStyle}>MAE</th>
                  <th style={thStyle}>RMSE</th>
                  <th style={thStyle}>MAPE</th>
                </tr>
              </thead>
              <tbody>
                {MODEL_COMPARISON.map(m => (
                  <tr key={m.model} style={m.best ? { background: 'rgba(8,145,178,0.12)' } : {}}>
                    <td style={{ ...tdStyle, fontWeight: m.best ? 700 : 400, color: m.best ? C.teal : C.white }}>
                      {m.model}{m.best ? ' \u2605' : ''}
                    </td>
                    <td style={{ ...tdStyle, fontWeight: m.best ? 700 : 400 }}>{m.mae}</td>
                    <td style={{ ...tdStyle, fontWeight: m.best ? 700 : 400 }}>{m.rmse}</td>
                    <td style={{ ...tdStyle, fontWeight: m.best ? 700 : 400 }}>{m.mape}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Stockout Risk Table */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', marginBottom: 16 }}>Stockout Risk Monitor</div>
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr>
                  <th style={thStyle}>Material</th>
                  <th style={thStyle}>Days Left</th>
                  <th style={thStyle}>Risk</th>
                  <th style={thStyle}>Action</th>
                </tr>
              </thead>
              <tbody>
                {STOCKOUT_RISKS.map(s => (
                  <tr key={s.material}>
                    <td style={tdStyle}>{s.material}</td>
                    <td style={tdStyle}>{s.days}</td>
                    <td style={tdStyle}>
                      <span style={{
                        display: 'inline-block', fontSize: 12, fontWeight: 600, padding: '2px 10px', borderRadius: 12,
                        background: `${RISK_COLORS[s.risk]}22`, color: RISK_COLORS[s.risk],
                      }}>{RISK_EMOJI[s.risk]} {s.risk}</span>
                    </td>
                    <td style={tdStyle}>{s.action}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* ROI Box */}
          <div style={{
            background: '#0F2A1F', border: `1px solid ${C.green}`, borderRadius: 8, padding: 16,
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 24, fontSize: 14, fontWeight: 600,
          }}>
            <span style={{ color: C.green }}>{'\u20AC'}147,000/god</span>
            <span style={{ color: C.border }}>|</span>
            <span style={{ color: C.white }}>Payback: 1.5 mj</span>
            <span style={{ color: C.border }}>|</span>
            <span style={{ color: C.teal }}>ROI: 720%</span>
          </div>
        </div>
      );
    }

    // ── OEE TAB ───────────────────────────────────────────────
    const OEE_LINES = [
      { line: 'L1', A: 83, P: 88, Q: 96, oee: 71 },
      { line: 'L2', A: 81, P: 85, Q: 95, oee: 65 },
      { line: 'L3', A: 87, P: 90, Q: 97, oee: 76 },
      { line: 'L4', A: 85, P: 87, Q: 96, oee: 71 },
      { line: 'L5', A: 82, P: 86, Q: 95, oee: 67 },
      { line: 'L6', A: 80, P: 84, Q: 94, oee: 63 },
      { line: 'L7', A: 78, P: 83, Q: 93, oee: 60 },
      { line: 'L8', A: 84, P: 89, Q: 96, oee: 72 },
    ];

    const SIX_LOSSES = [
      { name: 'Breakdowns', loss: 8 },
      { name: 'Changeover', loss: 5 },
      { name: 'Speed Loss', loss: 4 },
      { name: 'Minor Stops', loss: 3 },
      { name: 'Defects', loss: 3 },
      { name: 'Startup', loss: 1 },

    const WHATIF_RESULTS = {
      shift: 'Projected output: +18% | OEE impact: -2.1% (fatigue) | Net gain: +15.9%',
      remove: 'Capacity reduction: -12.5% | OEE improvement: +1.8% | Recommendation: Redistribute to L3, L8',
      capacity: 'Additional output: 73,200 pari/god | Required investment: \u20AC45,000 | ROI: 8 months',
    };

    function OeeTab() {
      const [selectedScenario, setSelectedScenario] = React.useState(null);
      const darkTooltip = { contentStyle: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 12 }, itemStyle: { color: C.white }, labelStyle: { color: C.grey } };
      const thStyle = { padding: '10px 14px', textAlign: 'left', fontSize: 12, fontWeight: 600, color: C.grey, textTransform: 'uppercase', borderBottom: `1px solid ${C.border}` };
      const tdStyle = { padding: '10px 14px', fontSize: 13, color: C.white, borderBottom: `1px solid ${C.border}` };

      const oeeBarColor = (entry) => {
        if (entry.oee > 75) return C.teal;
        if (entry.oee >= 65) return C.yellow;
        return C.red;
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          {/* Top row — 4 metric cards */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
            <div className="card" style={{ textAlign: 'center' }}>
              <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Avg OEE</div>
              <div style={{ fontSize: 36, fontWeight: 700, color: C.teal }}>76.3%</div>
            </div>
            <div className="card" style={{ textAlign: 'center' }}>
              <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Best: L3</div>
              <div style={{ fontSize: 36, fontWeight: 700, color: C.green }}>82.1%</div>
            </div>
            <div className="card" style={{ textAlign: 'center' }}>
              <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Worst: L7</div>
              <div style={{ fontSize: 36, fontWeight: 700, color: C.red }}>68.5%</div>
            </div>
            <div className="card" style={{ textAlign: 'center' }}>
              <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Anomalies</div>
              <div style={{ fontSize: 36, fontWeight: 700, color: C.yellow }}>23</div>
            </div>
          </div>

          {/* OEE by Line Chart */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', marginBottom: 16 }}>OEE po liniji (%)</div>
            <ResponsiveContainer width="100%" height={300}>
              <BarChart data={OEE_LINES} margin={{ top: 5, right: 30, left: 0, bottom: 5 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
                <XAxis dataKey="line" tick={{ fill: C.grey, fontSize: 11 }} />
                <YAxis tick={{ fill: C.grey, fontSize: 11 }} domain={[0, 100]} unit="%" />
                <Tooltip {...darkTooltip} formatter={(val, name) => [`${val}%`, name]} />
                <ReferenceLine y={85} stroke={C.red} strokeDasharray="5 5" label={{ value: 'Target 85%', fill: C.red, fontSize: 11, position: 'right' }} />
                <Bar dataKey="oee" name="OEE" radius={[4,4,0,0]}>
                  {OEE_LINES.map((entry, idx) => (
                    <Cell key={idx} fill={oeeBarColor(entry)} />
                  ))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          {/* Six Big Losses */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', marginBottom: 16 }}>Six Big Losses (%)</div>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={SIX_LOSSES} layout="vertical" margin={{ top: 5, right: 40, left: 100, bottom: 5 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} horizontal={false} />
                <XAxis type="number" tick={{ fill: C.grey, fontSize: 11 }} unit="%" />
                <YAxis type="category" dataKey="name" tick={{ fill: C.grey, fontSize: 11 }} width={90} />
                <Tooltip {...darkTooltip} />
                <Bar dataKey="loss" fill={C.red} radius={[0,4,4,0]} label={{ position: 'right', fill: C.white, fontSize: 11, formatter: (v) => v + '%' }} />
              </BarChart>
            </ResponsiveContainer>
          </div>

          {/* What-If Scenarios */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', marginBottom: 16 }}>What-If Scenarios</div>
            <div style={{ display: 'flex', gap: 12, marginBottom: selectedScenario ? 16 : 0 }}>
              {[
                { id: 'shift', label: 'Add 3rd Shift' },
                { id: 'remove', label: 'Remove Line L7' },
                { id: 'capacity', label: '+10% Capacity' },
              ].map(s => (
                <button key={s.id} onClick={() => setSelectedScenario(selectedScenario === s.id ? null : s.id)} style={{
                  padding: '10px 20px', fontSize: 13, fontWeight: 500, border: `1px solid ${C.border}`,
                  borderRadius: 8, cursor: 'pointer', transition: 'all 0.2s',
                  background: selectedScenario === s.id ? C.teal : 'transparent',
                  color: selectedScenario === s.id ? C.white : C.grey,
                }}>
                  {s.label}
                </button>
              ))}
            </div>
            {selectedScenario && (
              <div style={{
                background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: 14,
                fontSize: 13, color: C.white, lineHeight: 1.6,
              }}>
                {WHATIF_RESULTS[selectedScenario]}
              </div>
            )}
          </div>

          {/* ROI Box */}
          <div style={{
            background: '#0F2A1F', border: `1px solid ${C.green}`, borderRadius: 8, padding: 16,
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 24, fontSize: 14, fontWeight: 600,
          }}>
            <span style={{ color: C.green }}>{'\u20AC'}198,000/god</span>
            <span style={{ color: C.border }}>|</span>
            <span style={{ color: C.white }}>Payback: 1.4 mj</span>
            <span style={{ color: C.border }}>|</span>
            <span style={{ color: C.teal }}>ROI: 890%</span>
          </div>
        </div>
      );
    }

    // ── TAB CONTENT ROUTER ───────────────────────────────────
    function TabContent({ activeTab }) {
      if (activeTab === 'qc') return <QCTab />;
      if (activeTab === 'trade') return <TradeTab />;
      if (activeTab === 'knowledge') return <KnowledgeTab />;
      if (activeTab === 'forecast') return <ForecastTab />;
      if (activeTab === 'oee') return <OeeTab />;
      return <div style={{ color: C.grey, fontSize: 14 }}>Tab content: {activeTab}</div>;
    }

    // ── APP ───────────────────────────────────────────────────
    function App() {
      const [activeTab, setActiveTab] = React.useState('qc');

      return (
        <div style={{ minHeight: '100vh', background: C.bg }}>
          <Header />
          <SummaryCards />
          <TabBar activeTab={activeTab} onSelect={setActiveTab} />
          <div style={{ padding: '24px 32px' }}>
            <TabContent activeTab={activeTab} />
          </div>
          <div id="roi-footer"></div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
