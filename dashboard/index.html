<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPORTEK AI PLATFORMA — Executive Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            slate: {
              800: '#1E293B',
              850: '#172032',
              900: '#0F172A',
              950: '#0a1120',
            },
          },
        },
      },
    };
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0F172A; color: #F8FAFC; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0F172A; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes countUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .slide-in { animation: slideIn 0.3s ease-out forwards; }
    .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }

    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -2px rgba(0,0,0,0.2);
    }
    .card:hover {
      border-color: #0891B2;
      box-shadow: 0 8px 25px -5px rgba(8,145,178,0.15), 0 4px 10px -3px rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }

    .tab-btn { transition: all 0.2s ease; position: relative; }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: #0891B2;
      transition: width 0.3s ease;
      border-radius: 1px;
    }
    .tab-btn.active::after { width: 60%; }
    .tab-btn:hover::after { width: 40%; }
    .tab-btn.active:hover::after { width: 60%; }

    .gauge-bg { background: conic-gradient(from 180deg, #334155 0%, #334155 100%); }

    .chat-bubble-user {
      background: linear-gradient(135deg, #0891B2, #0e7490);
      border-radius: 16px 16px 4px 16px;
    }
    .chat-bubble-ai {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 16px 16px 16px 4px;
    }

    .mini-card {
      background: linear-gradient(135deg, #1E293B, #172032);
      border: 1px solid #334155;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .mini-card:hover { border-color: rgba(8,145,178,0.5); }

    .recharts-default-tooltip {
      background: #1E293B !important;
      border: 1px solid #334155 !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5) !important;
    }
    .recharts-tooltip-item { color: #F8FAFC !important; }
    .recharts-tooltip-label { color: #94A3B8 !important; }

    .roi-box {
      background: linear-gradient(135deg, rgba(8,145,178,0.1), rgba(16,185,129,0.08));
      border: 1px solid rgba(8,145,178,0.3);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid,
      Tooltip, Legend, ResponsiveContainer, ComposedChart, Area,
      PieChart, Pie, Cell, RadarChart, Radar, PolarGrid,
      PolarAngleAxis, PolarRadiusAxis, RadialBarChart, RadialBar,
    } = Recharts;

    // ── COLOUR PALETTE ──────────────────────────────────────────
    const C = {
      bg: '#0F172A', card: '#1E293B', border: '#334155',
      teal: '#0891B2', tealLight: '#22d3ee', tealDark: '#0e7490',
      green: '#10B981', yellow: '#F59E0B', red: '#EF4444',
      white: '#F8FAFC', grey: '#94A3B8', greyDark: '#64748B',
      orange: '#F97316', purple: '#8B5CF6', blue: '#3B82F6',
    };

    // ── ICONS (unicode) ─────────────────────────────────────────
    const Icons = {
      eye: '\uD83D\uDC41\uFE0F',
      globe: '\uD83C\uDF10',
      book: '\uD83D\uDCDA',
      chart: '\uD83D\uDCC8',
      gauge: '\u2699\uFE0F',
      doc: '\uD83D\uDCCB',
      check: '\u2713',
      cross: '\u2717',
      up: '\u2191',
      down: '\u2193',
      right: '\u2192',
      star: '\u2605',
      bolt: '\u26A1',
      shield: '\uD83D\uDEE1\uFE0F',
      factory: '\uD83C\uDFED',
      search: '\uD83D\uDD0D',
      clock: '\uD83D\uDD50',
    };

    // ── HEADER ──────────────────────────────────────────────────
    function Header() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('bs-BA', { day: '2-digit', month: 'long', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('bs-BA', { hour: '2-digit', minute: '2-digit' });
      return (
        <header className="fixed top-0 left-0 right-0 z-50" style={{ background: 'linear-gradient(180deg, #0a1120 0%, #0F172A 100%)', borderBottom: '1px solid #1E293B' }}>
          <div className="max-w-[1600px] mx-auto px-6 py-3 flex items-center justify-between">
            <div className="flex items-center gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold" style={{ background: 'linear-gradient(135deg, #0891B2, #0e7490)' }}>S</div>
                  <h1 className="text-lg font-bold tracking-wide" style={{ color: C.white }}>
                    SPORTEK <span style={{ color: C.teal }}>AI</span> PLATFORMA
                  </h1>
                </div>
                <p className="text-xs mt-0.5 ml-10" style={{ color: C.greyDark }}>Zecchetto Group — Intelligent Manufacturing</p>
              </div>
            </div>
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-2">
                <div className="w-2 h-2 rounded-full pulse-dot" style={{ background: C.green }}></div>
                <span className="text-xs font-medium" style={{ color: C.green }}>System Online</span>
              </div>
              <div className="px-3 py-1 rounded-full text-xs font-medium" style={{ background: 'rgba(8,145,178,0.15)', color: C.teal, border: `1px solid rgba(8,145,178,0.3)` }}>
                6 AI Modula Active
              </div>
              <div className="text-right">
                <div className="text-xs font-medium" style={{ color: C.grey }}>{dateStr}</div>
                <div className="text-xs" style={{ color: C.greyDark }}>{timeStr}</div>
              </div>
            </div>
          </div>
        </header>
      );
    }

    // ── SUMMARY CARD ────────────────────────────────────────────
    function SummaryCard({ title, value, unit, change, changeLabel, positive, icon, extra }) {
      const changeColor = positive ? C.green : C.red;
      const arrow = positive ? Icons.up : Icons.down;
      return (
        <div className="card p-5 fade-in">
          <div className="flex items-start justify-between mb-3">
            <span className="text-xs font-medium uppercase tracking-wider" style={{ color: C.grey }}>{title}</span>
            <span className="text-lg">{icon}</span>
          </div>
          <div className="flex items-end gap-2 mb-2">
            <span className="text-3xl font-bold" style={{ color: C.white }}>{value}</span>
            {unit && <span className="text-sm font-medium mb-1" style={{ color: C.grey }}>{unit}</span>}
          </div>
          <div className="flex items-center gap-2">
            <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ background: `${changeColor}20`, color: changeColor }}>
              {arrow} {change}
            </span>
            {changeLabel && <span className="text-xs" style={{ color: C.greyDark }}>{changeLabel}</span>}
          </div>
          {extra && <div className="mt-3">{extra}</div>}
        </div>
      );
    }

    // ── EXECUTIVE SUMMARY ───────────────────────────────────────
    function ExecutiveSummary() {
      const oeePercent = 76.3;
      const oeeTarget = 85;
      return (
        <div className="grid grid-cols-4 gap-4 mb-6 fade-in">
          <SummaryCard
            title="Dnevna Proizvodnja" value="2,340" unit="pari"
            change="5.2%" changeLabel="vs prethodni dan" positive={true}
            icon={Icons.factory}
          />
          <div className="card p-5 fade-in">
            <div className="flex items-start justify-between mb-3">
              <span className="text-xs font-medium uppercase tracking-wider" style={{ color: C.grey }}>OEE Prosjek</span>
              <span className="text-lg">{Icons.gauge}</span>
            </div>
            <div className="flex items-end gap-2 mb-3">
              <span className="text-3xl font-bold" style={{ color: C.white }}>{oeePercent}%</span>
              <span className="text-sm font-medium mb-1" style={{ color: C.grey }}>/ {oeeTarget}%</span>
            </div>
            <div className="w-full h-2 rounded-full" style={{ background: C.border }}>
              <div className="h-2 rounded-full" style={{ width: `${(oeePercent / oeeTarget) * 100}%`, background: `linear-gradient(90deg, ${C.teal}, ${C.tealLight})`, transition: 'width 1s ease' }}></div>
            </div>
            <div className="flex justify-between mt-1">
              <span className="text-xs" style={{ color: C.greyDark }}>Trenutno</span>
              <span className="text-xs" style={{ color: C.greyDark }}>Target {oeeTarget}%</span>
            </div>
          </div>
          <SummaryCard
            title="Defect Rate" value="3.2%" unit=""
            change="0.8%" changeLabel="vs prethodni mjesec" positive={true}
            icon={Icons.shield}
          />
          <div className="card p-5 fade-in group relative">
            <div className="flex items-start justify-between mb-3">
              <span className="text-xs font-medium uppercase tracking-wider" style={{ color: C.grey }}>Godisnje Ustede AI</span>
              <span className="text-lg">{Icons.bolt}</span>
            </div>
            <div className="flex items-end gap-1 mb-2">
              <span className="text-3xl font-bold" style={{ color: C.green }}>847,000</span>
              <span className="text-sm font-medium mb-1" style={{ color: C.grey }}>EUR</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ background: `${C.green}20`, color: C.green }}>6 modula</span>
              <span className="text-xs" style={{ color: C.greyDark }}>ukupan ROI</span>
            </div>
            <div className="absolute top-full left-0 right-0 mt-2 p-3 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-10" style={{ background: '#0a1120', border: `1px solid ${C.border}` }}>
              <div className="text-xs space-y-1" style={{ color: C.grey }}>
                <div className="flex justify-between"><span>CV Quality</span><span style={{ color: C.green }}>99,271</span></div>
                <div className="flex justify-between"><span>TradeFlow</span><span style={{ color: C.green }}>354,734</span></div>
                <div className="flex justify-between"><span>Knowledge</span><span style={{ color: C.green }}>20,431</span></div>
                <div className="flex justify-between"><span>Forecast</span><span style={{ color: C.green }}>168,200</span></div>
                <div className="flex justify-between"><span>OEE Dashboard</span><span style={{ color: C.green }}>151,793</span></div>
                <div className="flex justify-between"><span>Reporting</span><span style={{ color: C.green }}>52,571</span></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── TAB NAV ─────────────────────────────────────────────────
    const TABS = [
      { id: 'qc', label: 'QC Vision', icon: '\uD83D\uDC41\uFE0F' },
      { id: 'trade', label: 'TradeFlow', icon: '\uD83C\uDF10' },
      { id: 'knowledge', label: 'Knowledge', icon: '\uD83D\uDCDA' },
      { id: 'forecast', label: 'Forecast', icon: '\uD83D\uDCC8' },
      { id: 'oee', label: 'OEE', icon: '\u2699\uFE0F' },
      { id: 'reporting', label: 'Reporting', icon: '\uD83D\uDCCB' },
    ];

    function TabNav({ active, onSelect }) {
      return (
        <div className="flex gap-1 p-1 rounded-xl mb-6" style={{ background: '#172032' }}>
          {TABS.map(t => (
            <button key={t.id}
              className={`tab-btn flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg text-sm font-medium transition-all ${active === t.id ? 'active' : ''}`}
              style={{
                background: active === t.id ? C.card : 'transparent',
                color: active === t.id ? C.teal : C.greyDark,
                border: active === t.id ? `1px solid ${C.border}` : '1px solid transparent',
              }}
              onClick={() => onSelect(t.id)}
            >
              <span>{t.icon}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </div>
      );
    }

    // ── ROI BOX ─────────────────────────────────────────────────
    function ROIBox({ saving, payback, roi }) {
      return (
        <div className="roi-box p-4">
          <div className="text-xs font-semibold uppercase tracking-wider mb-3" style={{ color: C.teal }}>ROI Analiza</div>
          <div className="grid grid-cols-3 gap-4">
            <div>
              <div className="text-xl font-bold" style={{ color: C.green }}>{saving}</div>
              <div className="text-xs" style={{ color: C.grey }}>Godisnja usteda</div>
            </div>
            <div>
              <div className="text-xl font-bold" style={{ color: C.tealLight }}>{payback}</div>
              <div className="text-xs" style={{ color: C.grey }}>Payback</div>
            </div>
            <div>
              <div className="text-xl font-bold" style={{ color: C.green }}>{roi}</div>
              <div className="text-xs" style={{ color: C.grey }}>3yr ROI</div>
            </div>
          </div>
        </div>
      );
    }

    // ── MINI STAT CARD ──────────────────────────────────────────
    function MiniStat({ label, value, sub, color }) {
      return (
        <div className="mini-card p-4 text-center">
          <div className="text-2xl font-bold mb-1" style={{ color: color || C.tealLight }}>{value}</div>
          <div className="text-xs font-medium" style={{ color: C.white }}>{label}</div>
          {sub && <div className="text-xs mt-1" style={{ color: C.greyDark }}>{sub}</div>}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════
    // TAB 1 — QUALITY CONTROL
    // ════════════════════════════════════════════════════════════
    function TabQC() {
      const paretoData = [
        { name: 'Sav neravnomjeran', count: 1100, cumPct: 22 },
        { name: 'Ljepilo vidljivo', count: 900, cumPct: 40 },
        { name: 'Boja odstupa', count: 700, cumPct: 54 },
        { name: 'Materijal ostecen', count: 600, cumPct: 66 },
        { name: 'Dimenzija', count: 500, cumPct: 76 },
        { name: '3D knit defekt', count: 450, cumPct: 85 },
        { name: 'Logo pozicija', count: 400, cumPct: 93 },
        { name: 'Djon odvajanje', count: 350, cumPct: 100 },
      ];

      const trendData = [
        { m: 'Jan', Nike: 4.5, Crocs: 4.0, Decathlon: 3.8, Ukupno: 4.1 },
        { m: 'Feb', Nike: 4.2, Crocs: 3.6, Decathlon: 3.5, Ukupno: 3.8 },
        { m: 'Mar', Nike: 4.3, Crocs: 3.7, Decathlon: 3.6, Ukupno: 3.9 },
        { m: 'Apr', Nike: 3.9, Crocs: 3.3, Decathlon: 3.2, Ukupno: 3.5 },
        { m: 'Maj', Nike: 3.6, Crocs: 3.2, Decathlon: 3.0, Ukupno: 3.3 },
        { m: 'Jun', Nike: 3.8, Crocs: 3.3, Decathlon: 3.1, Ukupno: 3.4 },
        { m: 'Jul', Nike: 4.0, Crocs: 3.5, Decathlon: 3.2, Ukupno: 3.6 },
        { m: 'Aug', Nike: 3.9, Crocs: 3.3, Decathlon: 3.2, Ukupno: 3.5 },
        { m: 'Sep', Nike: 3.6, Crocs: 3.0, Decathlon: 2.9, Ukupno: 3.2 },
        { m: 'Okt', Nike: 3.4, Crocs: 2.8, Decathlon: 2.7, Ukupno: 3.0 },
        { m: 'Nov', Nike: 3.2, Crocs: 2.7, Decathlon: 2.6, Ukupno: 2.9 },
        { m: 'Dec', Nike: 3.4, Crocs: 3.0, Decathlon: 2.8, Ukupno: 3.1 },
      ];

      const feed = [
        { time: '14:32', line: 'L1', model: 'Dunk Low Textile', result: 'pass', confidence: 98.4 },
        { time: '14:31', line: 'L3', model: 'Classic Clog Strap', result: 'fail', confidence: 94.1, defect: 'Sav neravnomjeran' },
        { time: '14:29', line: 'L2', model: 'Pegasus 3D Knit', result: 'pass', confidence: 97.8 },
        { time: '14:27', line: 'L6', model: 'Kalenji Trail Sole', result: 'pass', confidence: 96.2 },
        { time: '14:25', line: 'L4', model: 'ZoomX Carbon Plate', result: 'fail', confidence: 91.3, defect: 'Ljepilo vidljivo' },
        { time: '14:23', line: 'L1', model: 'Air Max Flyknit', result: 'pass', confidence: 99.1 },
        { time: '14:21', line: 'L5', model: 'Bayaband Slide', result: 'pass', confidence: 95.7 },
        { time: '14:19', line: 'L2', model: 'Vaporfly Mesh', result: 'fail', confidence: 88.6, defect: 'Boja odstupa' },
      ];

      return (
        <div className="fade-in space-y-4">
          {/* Top stats */}
          <div className="grid grid-cols-3 gap-4">
            <MiniStat label="Model Accuracy" value="94.2%" sub="ResNet50 + custom head" color={C.green} />
            <MiniStat label="Inspections Today" value="847" sub="+12% vs prosjecno" color={C.tealLight} />
            <MiniStat label="AI Speed" value="10x" sub="brze od manualne inspekcije" color={C.orange} />
          </div>

          {/* Charts row */}
          <div className="grid grid-cols-2 gap-4">
            {/* Pareto */}
            <div className="card p-5">
              <h3 className="text-sm font-semibold mb-4" style={{ color: C.white }}>Pareto Analiza Defekata</h3>
              <ResponsiveContainer width="100%" height={280}>
                <ComposedChart data={paretoData} margin={{ top: 5, right: 30, left: 0, bottom: 40 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                  <XAxis dataKey="name" tick={{ fill: C.grey, fontSize: 9 }} angle={-30} textAnchor="end" />
                  <YAxis yAxisId="left" tick={{ fill: C.grey, fontSize: 10 }} />
                  <YAxis yAxisId="right" orientation="right" domain={[0, 100]} tick={{ fill: C.grey, fontSize: 10 }} unit="%" />
                  <Tooltip contentStyle={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, color: C.white }} />
                  <Bar yAxisId="left" dataKey="count" fill={C.teal} radius={[4, 4, 0, 0]} />
                  <Line yAxisId="right" type="monotone" dataKey="cumPct" stroke={C.orange} strokeWidth={2} dot={{ fill: C.orange, r: 3 }} />
                </ComposedChart>
              </ResponsiveContainer>
            </div>

            {/* Trend */}
            <div className="card p-5">
              <h3 className="text-sm font-semibold mb-4" style={{ color: C.white }}>Defect Rate Trend (12 mjeseci)</h3>
              <ResponsiveContainer width="100%" height={280}>
                <LineChart data={trendData} margin={{ top: 5, right: 20, left: 0, bottom: 5 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                  <XAxis dataKey="m" tick={{ fill: C.grey, fontSize: 10 }} />
                  <YAxis tick={{ fill: C.grey, fontSize: 10 }} domain={[2, 5]} unit="%" />
                  <Tooltip contentStyle={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, color: C.white }} />
                  <Legend wrapperStyle={{ fontSize: 11, color: C.grey }} />
                  <Line type="monotone" dataKey="Nike" stroke={C.teal} strokeWidth={2} dot={{ r: 3 }} />
                  <Line type="monotone" dataKey="Crocs" stroke={C.tealLight} strokeWidth={2} dot={{ r: 3 }} />
                  <Line type="monotone" dataKey="Decathlon" stroke={C.orange} strokeWidth={2} dot={{ r: 3 }} />
                  <Line type="monotone" dataKey="Ukupno" stroke={C.white} strokeWidth={3} dot={{ r: 4 }} strokeDasharray="5 5" />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* Bottom row: feed + ROI */}
          <div className="grid grid-cols-3 gap-4">
            <div className="col-span-2 card p-5">
              <h3 className="text-sm font-semibold mb-3" style={{ color: C.white }}>Real-Time Inspection Feed</h3>
              <div className="space-y-2 max-h-[260px] overflow-y-auto pr-2">
                {feed.map((f, i) => (
                  <div key={i} className="flex items-center gap-3 p-2 rounded-lg slide-in" style={{ background: '#172032', animationDelay: `${i * 0.05}s` }}>
                    <div className="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold" style={{ background: f.result === 'pass' ? `${C.green}20` : `${C.red}20`, color: f.result === 'pass' ? C.green : C.red }}>
                      {f.result === 'pass' ? Icons.check : Icons.cross}
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-semibold" style={{ color: C.white }}>{f.model}</span>
                        <span className="text-xs px-1.5 py-0.5 rounded" style={{ background: `${C.teal}20`, color: C.teal }}>{f.line}</span>
                      </div>
                      {f.defect && <span className="text-xs" style={{ color: C.red }}>{f.defect}</span>}
                    </div>
                    <div className="text-right">
                      <div className="text-xs font-mono" style={{ color: f.confidence > 95 ? C.green : C.yellow }}>{f.confidence}%</div>

                  <PolarRadiusAxis angle={30} domain={[0, 100]} tick={{ fill: C.greyDark, fontSize: 9 }} />
                  <Radar name="Current" dataKey="current" stroke={C.teal} fill={C.teal} fillOpacity={0.3} strokeWidth={2} />
                  <Radar name="Target" dataKey="target" stroke={C.green} fill={C.green} fillOpacity={0.1} strokeWidth={2} strokeDasharray="5 5" />
                  <Legend wrapperStyle={{ fontSize: 11, color: C.grey }} />
                </RadarChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-4">
            {/* Brand comparison */}
            <div className="col-span-2 card p-5">
              <h3 className="text-sm font-semibold mb-4" style={{ color: C.white }}>Brand Comparison — Q4 2025</h3>
              <ResponsiveContainer width="100%" height={250}>
                <BarChart data={brandComp} margin={{ top: 5, right: 20, left: 0, bottom: 5 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                  <XAxis dataKey="brand" tick={{ fill: C.grey, fontSize: 11 }} />
                  <YAxis tick={{ fill: C.grey, fontSize: 10 }} />
                  <Tooltip contentStyle={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, color: C.white }} />
                  <Legend wrapperStyle={{ fontSize: 11, color: C.grey }} />
                  <Bar dataKey="defect" name="Defect %" fill={C.red} opacity={0.8} radius={[3, 3, 0, 0]} />
                  <Bar dataKey="fpy" name="FPY %" fill={C.green} opacity={0.8} radius={[3, 3, 0, 0]} />
                  <Bar dataKey="output" name="Output (K)" fill={C.teal} radius={[3, 3, 0, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>
            <ROIBox saving="52,571 EUR" payback="1.6 mj" roi="1,971%" />
          </div>
        </div>
      );
    }
