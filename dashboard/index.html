<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPORTEK AI PLATFORMA — Executive Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0F172A; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid,
      Tooltip, Legend, ResponsiveContainer, ComposedChart, Area,
      PieChart, Pie, Cell, RadarChart, Radar, PolarGrid,
      PolarAngleAxis, PolarRadiusAxis, ReferenceLine, AreaChart,
    } = Recharts;

    // ── COLOURS ───────────────────────────────────────────────
    const C = {
      bg: '#0F172A', card: '#1E293B', border: '#334155',
      teal: '#0891B2', tealLight: '#22d3ee',
      green: '#10B981', yellow: '#F59E0B', red: '#EF4444',
      white: '#F8FAFC', grey: '#94A3B8', greyDark: '#64748B',
      orange: '#F97316', purple: '#8B5CF6',
    };

    // ── TAB DEFINITIONS ───────────────────────────────────────
    const TABS = [
      { id: 'qc', label: 'QC Vision' },
      { id: 'trade', label: 'TradeFlow' },
      { id: 'knowledge', label: 'Knowledge' },
      { id: 'forecast', label: 'Forecast' },
      { id: 'oee', label: 'OEE' },
      { id: 'reporting', label: 'Reporting' },
    ];

    // ── HEADER ────────────────────────────────────────────────
    function Header() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('bs-BA', { day: '2-digit', month: 'long', year: 'numeric' });
      return (
        <div style={{
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          padding: '16px 32px', background: C.card, borderBottom: `1px solid ${C.border}`,
        }}>
          <div>
            <h1 style={{ fontWeight: 800, fontSize: 20, color: C.white, letterSpacing: '0.5px' }}>
              SPORTEK <span style={{ color: C.teal }}>AI</span> PLATFORMA
            </h1>
            <span style={{ color: C.grey, fontSize: 14 }}>Zecchetto Group — Intelligent Manufacturing</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: C.green }}></div>
              <span style={{ color: C.green, fontSize: 13, fontWeight: 500 }}>System Online</span>
            </div>
            <span style={{
              padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 500,
              background: 'rgba(8,145,178,0.15)', color: C.teal,
            }}>6 AI Modula</span>
            <span style={{ color: C.grey, fontSize: 13 }}>{dateStr}</span>
          </div>
        </div>
      );
    }

    // ── SUMMARY CARDS ─────────────────────────────────────────
    function SummaryCards() {
      const oee = 76.3;
      return (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, padding: '24px 32px' }}>
          {/* Card 1 — Dnevna proizvodnja */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Dnevna proizvodnja</div>
            <div style={{ fontSize: 32, fontWeight: 700, color: C.white }}>2,340</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 6 }}>
              <span style={{ color: C.grey, fontSize: 13 }}>pari</span>
              <span style={{
                fontSize: 12, fontWeight: 600, padding: '2px 8px', borderRadius: 12,
                background: 'rgba(16,185,129,0.15)', color: C.green,
              }}>{'\u2191'} 5.2%</span>
            </div>
          </div>

          {/* Card 2 — OEE Prosjek */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>OEE Prosjek</div>
            <div style={{ fontSize: 32, fontWeight: 700, color: C.white }}>{oee}%</div>
            <div style={{
              width: '100%', height: 8, borderRadius: 4, background: C.border, marginTop: 10,
            }}>
              <div style={{
                width: `${oee}%`, height: '100%', borderRadius: 4,
                background: `linear-gradient(90deg, ${C.teal}, ${C.tealLight})`,
              }}></div>
            </div>
            <div style={{ color: C.grey, fontSize: 12, marginTop: 6 }}>Target: 85%</div>
          </div>

          {/* Card 3 — Defect Rate */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Defect Rate</div>
            <div style={{ fontSize: 32, fontWeight: 700, color: C.white }}>3.2%</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 6 }}>
              <span style={{
                fontSize: 12, fontWeight: 600, padding: '2px 8px', borderRadius: 12,
                background: 'rgba(16,185,129,0.15)', color: C.green,
              }}>{'\u2193'} 0.8%</span>
            </div>
          </div>

          {/* Card 4 — Godišnje AI uštede */}
          <div className="card">
            <div style={{ color: C.grey, fontSize: 12, fontWeight: 500, textTransform: 'uppercase', marginBottom: 8 }}>Godišnje AI uštede</div>
            <div style={{ fontSize: 32, fontWeight: 700, color: C.green }}>{'\u20AC'}872,007</div>
            <div style={{ color: C.grey, fontSize: 13, marginTop: 6 }}>6 modula aktivno</div>
          </div>
        </div>
      );
    }

    // ── TAB BAR ───────────────────────────────────────────────
    function TabBar({ activeTab, onSelect }) {
      return (
        <div style={{
          display: 'flex', gap: 4, padding: '0 32px', background: C.card,
        }}>
          {TABS.map(t => (
            <button key={t.id} onClick={() => onSelect(t.id)} style={{
              padding: '10px 20px', fontSize: 13, fontWeight: 500, border: 'none', cursor: 'pointer',
              borderRadius: activeTab === t.id ? 8 : 8,
              background: activeTab === t.id ? C.teal : 'transparent',
              color: activeTab === t.id ? C.white : C.greyDark,
              transition: 'all 0.2s',
            }}
              onMouseEnter={e => { if (activeTab !== t.id) e.target.style.background = C.border; }}
              onMouseLeave={e => { if (activeTab !== t.id) e.target.style.background = 'transparent'; }}
            >
              {t.label}
            </button>
          ))}
        </div>
      );
    }

    // ── APP ───────────────────────────────────────────────────
    function App() {
      const [activeTab, setActiveTab] = React.useState('qc');

      return (
        <div style={{ minHeight: '100vh', background: C.bg }}>
          <Header />
          <SummaryCards />
          <TabBar activeTab={activeTab} onSelect={setActiveTab} />
          <div style={{ padding: '24px 32px' }}>
            <div style={{ color: C.grey, fontSize: 14 }}>Tab content: {activeTab}</div>
          </div>
          <div id="roi-footer"></div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
